<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Membuat Unordered List</title>
    <style>
        ul {
            /* Menghilangkan bullet bawaan browser */
            list-style-type: none; 
            padding-left: 20px;
        }

        ul li {
            /* Memasukkan gambar sebagai background */
            background-image: url('AB.jpeg'); 
            background-repeat: no-repeat;
            background-position: left center;
            
            /* SILAKAN ATUR UKURAN GAMBAR DI SINI (Contoh: lebar 15px, tinggi 15px) */
            background-size: 15px 15px; 
            
            /* Memberi jarak teks dari gambar bullet */
            padding-left: 25px; 
            margin-bottom: 8px;
        }
    </style>
</head>
<body>

    <h1>Bahasa Pemrograman untuk dipelajari:</h1>
    
    <ul>
        <li>PHP</li>
        <li>Java</li>
        <li>Python</li>
        <li>Kotlin</li>
    </ul>

</body>
</html>
